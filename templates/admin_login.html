<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="wrap narrow"><h1>Owner login</h1>
{% for m in get_flashed_messages() %}<div class="alert">{{ m }}</div>{% endfor %}
<form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Password<input type="password" name="password" autofocus></label>
<button class="btn" type="submit">Log in</button></form>
{% if demo_admin %}<form method="post" action="/admin/demo" class="form"><input type="hidden" name="csrf" value="{{ csrf }}"><p class="muted">Not the owner? Look around the owner's panel. It is read-only and hides guests' details.</p><button class="btn alt" type="submit">Look around (read-only demo)</button></form>{% endif %}<p><a class="link" href="/">Back to the website</a></p></main></body></html>
